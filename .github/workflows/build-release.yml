name: Build & Publish Release APKs

on:
  release:
    types: [published]

jobs:
  build:
    name: Build signed release APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write  # required to upload assets to the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat > lib/.env << 'EOF'
          deezerClientId = '${{ secrets.DEEZER_CLIENT_ID }}'
          deezerClientSecret = '${{ secrets.DEEZER_CLIENT_SECRET }}'
          lastFmApiKey = '${{ secrets.LASTFM_API_KEY }}'
          lastFmApiSecret = '${{ secrets.LASTFM_API_SECRET }}'
          EOF

      - name: Set up signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keys.jks
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../keys.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build files
        run: |
          # Run build_runner for each submodule that needs it (mirrors run_build_runner.ps1)
          git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}' | while read -r subdir; do
            if [ -f "$subdir/pubspec.yaml" ] && grep -q "build_runner" "$subdir/pubspec.yaml"; then
              echo "==> Running build_runner in $subdir"
              # json_serializable >=6.9 emits null-aware-elements (requires Dart >=3.8).
              # The submodule may declare a lower minimum; bump it so the generator proceeds.
              sed -i 's/sdk: ">=3\.0\.0 <4\.0\.0"/sdk: ">=3.8.0 <4.0.0"/' "$subdir/pubspec.yaml"
              (cd "$subdir" && flutter pub get && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          # Run build_runner for the main project
          dart run build_runner build --delete-conflicting-outputs

      - name: Build release APKs (split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
