name: Build APK (PR)

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write  # required to post the artifact comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat > lib/.env << 'EOF'
          deezerClientId = '${{ secrets.DEEZER_CLIENT_ID }}'
          deezerClientSecret = '${{ secrets.DEEZER_CLIENT_SECRET }}'
          lastFmApiKey = '${{ secrets.LASTFM_API_KEY }}'
          lastFmApiSecret = '${{ secrets.LASTFM_API_SECRET }}'
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build files
        run: |
          # Run build_runner for each submodule that needs it (mirrors run_build_runner.ps1)
          git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}' | while read -r subdir; do
            if [ -f "$subdir/pubspec.yaml" ] && grep -q "build_runner" "$subdir/pubspec.yaml"; then
              echo "==> Running build_runner in $subdir"
              # json_serializable >=6.9 emits null-aware-elements (requires Dart >=3.8).
              # The submodule may declare a lower minimum; bump it so the generator proceeds.
              sed -i 's/sdk: ">=3\.0\.0 <4\.0\.0"/sdk: ">=3.8.0 <4.0.0"/' "$subdir/pubspec.yaml"
              (cd "$subdir" && flutter pub get && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          # Run build_runner for the main project
          dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APKs (split per ABI)
        run: flutter build apk --split-per-abi --debug

      - name: Upload APK artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: refreezer-debug-apks-pr${{ github.event.pull_request.number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Post comment with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 📦 Debug APKs',
              '',
              'Debug APKs have been built for this pull request and are available as workflow artifacts.',
              '',
              '| Architecture | Target |',
              '|---|---|',
              '| `app-arm64-v8a-debug.apk` | Modern Android phones / tablets (64-bit ARM) |',
              '| `app-armeabi-v7a-debug.apk` | Older Android phones / tablets (32-bit ARM) |',
              '| `app-x86_64-debug.apk` | Android emulator / x86 devices |',
              '',
              `**[⬇️ Download APKs](${artifactUrl})**`,
              '',
              `> Artifacts expire after 7 days. Built from run [#${context.runId}](${runUrl}).`,
              '> These are **debug** builds for testing purposes only — not optimised for daily use.',
              '',
              '### Install via ADB',
              '```bash',
              '# Phone / tablet',
              'adb install app-arm64-v8a-debug.apk',
              '',
              '# Android TV (over Wi-Fi)',
              'adb connect 192.168.1.100:5555',
              'adb install app-arm64-v8a-debug.apk',
              '```',
            ].join('\n');

            // Update existing bot comment if present, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 📦 Debug APKs')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
