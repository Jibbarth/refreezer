name: Build APK (PR)

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write  # required to post the artifact comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat > lib/.env << 'EOF'
          deezerClientId = '${{ secrets.DEEZER_CLIENT_ID }}'
          deezerClientSecret = '${{ secrets.DEEZER_CLIENT_SECRET }}'
          lastFmApiKey = '${{ secrets.LASTFM_API_KEY }}'
          lastFmApiSecret = '${{ secrets.LASTFM_API_SECRET }}'
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build files
        run: ./run_build_runner.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: refreezer-debug-apk-pr${{ github.event.pull_request.number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Post comment with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 📦 Debug APK',
              '',
              'A debug APK has been built for this pull request and is available as a workflow artifact.',
              '',
              `**[⬇️ Download APK](${artifactUrl})**`,
              '',
              `> Artifacts expire after 7 days. Built from run [#${context.runId}](${runUrl}).`,
              '> This is a **debug** build for testing purposes only — not optimised for daily use.',
              '',
              '### Install via ADB',
              '```bash',
              '# Connect to device (if needed)',
              'adb connect 192.168.1.100:5555',
              '# Install APK',
              'adb install app-debug.apk',
              '```',
            ].join('\n');

            // Update existing bot comment if present, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 📦 Debug APKs')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
